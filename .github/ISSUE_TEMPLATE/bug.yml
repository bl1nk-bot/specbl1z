name: Bug Report
description: Report a bug in specgen
title: "[BUG] "
labels: ["Bug", "wait"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Numbered steps to trigger the bug
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Error messages, logs, screenshots
      render: shell
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Termux/Android (ARM64)
        - Linux (x86_64)
        - Linux (musl/Alpine)
        - macOS (ARM64)
        - macOS (x86_64)
        - Windows (x86_64)
        - Windows (WSL)
        - Docker
    validations:
      required: true
  - type: input
    id: rust_version
    attributes:
      label: Rust Version
      placeholder: rustc 1.95.0
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: main / cleanup/reorg
  - type: input
    id: linear_ref
    attributes:
      label: Linear Issue (BNK-)
      placeholder: BNK-
