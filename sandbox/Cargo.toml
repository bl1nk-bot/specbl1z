[package]
name = "specgen-sandbox"
version = "0.1.0"
edition = "2021"
description = "OpenCode SDK in Rust — Daytona + Modal sandbox tools for Termux"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sandbox_bench"
harness = false
