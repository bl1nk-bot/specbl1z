[package]
name = "specgen-core"
version = "3.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
jsonschema = "0.18"
colored = "2"
regex = "1"
toml = "0.8"
pulldown-cmark = "0.10" # Added dependency
quick-xml = { version = "0.37", features = ["escape-html"] }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
ignore = "0.4"
bincode = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
pyo3 = { version = "0.23", features = ["auto-initialize"] }

[dev-dependencies]
tempfile = "3"
