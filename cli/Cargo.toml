[package]
name = "specgen"
version = "3.1.0"
edition = "2021"

[[bin]]
name = "specgen"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
specgen-core = { path = "../core" }
serde_json = "1"
serde_yaml = "0.9"
specgen-api = { path = "../api" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
colored = "3"
ignore = "0.4"
